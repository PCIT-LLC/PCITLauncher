name: Build Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish (self-contained)
        run: |
          dotnet publish PCITLauncher/PCITLauncher.csproj -c Release -r win-x64 --self-contained true -p:DebugType=None -p:DebugSymbols=false -o dist

      - name: Publish (framework-dependent)
        run: |
          dotnet publish PCITLauncher/PCITLauncher.csproj -c Release -r win-x64 --self-contained false -p:DebugType=None -p:DebugSymbols=false -o dist-framework

      - name: Zip (self-contained)
        run: |
          Compress-Archive -Path dist\* -DestinationPath PCITLauncher-${{ github.ref_name }}-self-contained.zip -Force

      - name: Zip (framework-dependent)
        run: |
          Compress-Archive -Path dist-framework\* -DestinationPath PCITLauncher-${{ github.ref_name }}-framework.zip -Force

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: PCITLauncher-${{ github.ref_name }}-self-contained.zip,PCITLauncher-${{ github.ref_name }}-framework.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
