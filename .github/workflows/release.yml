name: Build Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish
        run: |
          dotnet publish PCITLauncher/PCITLauncher.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o dist

      - name: Zip
        run: |
          Compress-Archive -Path dist\* -DestinationPath PCITLauncher-${{ github.ref_name }}.zip -Force

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: PCITLauncher-${{ github.ref_name }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
